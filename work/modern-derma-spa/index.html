<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Derma and Spa</title>
  <meta name="description" content="Personalized treatments, expert skincare, and medical-grade results at Modern Derma and Spa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/work/modern-derma-spa/styles.css">
</head>
<body>

  <div class="page-wrapper">
    <section class="hero-card">

      <!-- ── Background video (self-hosted) ────────────────────── -->
      <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
        <source src="/work/modern-derma-spa/background.mp4" type="video/mp4">
      </video>

      <!-- ── Content layer ──────────────────────────────────────── -->
      <div class="content-layer">

        <!-- Nav -->
        <nav class="navbar" role="navigation" aria-label="Main navigation">
          <div class="nav-spacer"></div>
          <ul class="nav-links" role="list">
            <li><a href="#">Services</a></li>
            <li><a href="#">Treatments</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Results</a></li>
          </ul>
          <div class="nav-mobile-brand" aria-hidden="true">Modern Derma</div>
          <div class="nav-cta-wrap">
            <a href="#" class="nav-cta" aria-label="Book a consultation">
              <span class="nav-cta-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M3.5 12.5L12.5 3.5M12.5 3.5H5.5M12.5 3.5V10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="nav-cta-text">Book a Consult</span>
            </a>
          </div>
        </nav>

        <!-- Hero text -->
        <div class="text-container">

          <div class="hero-badge anim-fade-up anim-d0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.937A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" fill="currentColor"/>
              <path d="M20 3v4M22 5h-4M4 17v2M5 18H3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Medical-Grade Care</span>
          </div>

          <h1 class="hero-heading anim-scale-in anim-d1">Reveal Your Radiance</h1>

          <p class="hero-subtext anim-fade-in anim-d2">Personalized treatments, expert skincare, and medical-grade results — designed to help you look and feel your best.</p>

        </div>

        <!-- Bottom-left card -->
        <div class="bottom-left-card anim-slide-in-left anim-d1">
          <div class="card-stat">
            <div class="stat-number">3,200<span class="stat-plus">+</span></div>
            <div class="stat-label">CLIENTS TREATED</div>
          </div>
          <a href="#" class="card-btn" aria-label="Book a visit">
            <span class="card-btn-icon">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 11L11 3M11 3H5M11 3V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span>Book a Visit</span>
          </a>
        </div>

        <!-- Bottom-right corner (faux-cutout) -->
        <div class="bottom-right-corner anim-fade-up anim-d2">
          <!-- Top intersection mask -->
          <div class="corner-mask corner-mask-top" aria-hidden="true">
            <svg width="100%" height="100%" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M56 56V0C56 30.9279 30.9279 56 0 56H56Z" fill="#f0f0f0"/>
            </svg>
          </div>
          <!-- Left intersection mask -->
          <div class="corner-mask corner-mask-left" aria-hidden="true">
            <svg width="100%" height="100%" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M56 56H0C30.9279 56 56 30.9279 56 0V56Z" fill="#f0f0f0"/>
            </svg>
          </div>
          <!-- Icon circle -->
          <div class="corner-icon-wrap">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4.5 15.5L15.5 4.5M15.5 4.5H7.5M15.5 4.5V12.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <!-- Info column -->
          <div class="corner-info">
            <div class="corner-title">Treatments</div>
            <a href="#" class="corner-link">
              Explore All
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M4 2.5L8.5 6L4 9.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>
        </div>

      </div>
    </section>
  </div>

  <script src="/work/modern-derma-spa/script.js"></script>
</body>
</html>
