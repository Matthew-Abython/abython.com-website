<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Dentistry</title>
  <meta name="description" content="Cosmic Dentistry — modern dental care built for brighter smiles.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Video Background ───────────────────────────────────── */
    .video-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
      overflow: hidden;
    }

    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateY(17%);
      opacity: 0;
    }

    /* ── Liquid Glass ───────────────────────────────────────── */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Navigation ─────────────────────────────────────────── */
    .site-nav {
      position: relative;
      z-index: 20;
      padding: 1.5rem;
    }

    .nav-inner {
      border-radius: 9999px;
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 64rem;
      margin: 0 auto;
    }

    .nav-left-group {
      display: flex;
      align-items: center;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #fff;
      font-weight: 600;
      font-size: 1.125rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-left: 2rem;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-new-patient {
      background: none;
      border: none;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }

    .nav-book-btn {
      border-radius: 9999px;
      padding: 0.5rem 1.5rem;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .nav-book-btn:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      transform: scale(1.04);
    }

    @media (max-width: 767px) {
      .nav-links {
        display: none;
      }
    }

    /* ── Hero ───────────────────────────────────────────────── */
    .hero {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      text-align: center;
      transform: translateY(-20%);
    }

    .hero h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 3rem;
      color: #fff;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
      line-height: 1.1;
    }

    @media (min-width: 768px) {
      .hero h1 {
        font-size: 3.75rem;
      }
    }

    @media (min-width: 1024px) {
      .hero h1 {
        font-size: 4.5rem;
      }
    }

    @media (max-width: 767px) {
      .hero h1 {
        white-space: normal;
      }
    }

    .hero-form-area {
      width: 100%;
      max-width: 36rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .email-bar {
      border-radius: 9999px;
      padding: 0.5rem 0.5rem 0.5rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .email-bar input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      min-width: 0;
    }

    .email-bar input[type="email"]::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .submit-btn {
      background: #fff;
      border: none;
      border-radius: 9999px;
      padding: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      flex-shrink: 0;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.85;
      transform: scale(1.04);
    }

    .hero-subtitle {
      color: #fff;
      font-size: 0.875rem;
      line-height: 1.6;
      padding: 0 1rem;
    }

    .manifesto-btn {
      border-radius: 9999px;
      padding: 0.75rem 2rem;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
      margin-top: 0.5rem;
    }

    .manifesto-btn:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      transform: scale(1.04);
    }

    /* ── Social Footer ──────────────────────────────────────── */
    .social-footer {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding-bottom: 3rem;
    }

    .icon-btn {
      border-radius: 9999px;
      padding: 1rem;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      font-family: inherit;
      transition: color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05) !important;
    }
  </style>
</head>
<body>

  <!-- Video Background -->
  <div class="video-wrapper">
    <video
      id="bg-video"
      src="/work/azure-cosmetic-dentistry/background.mp4"
      muted
      autoplay
      playsinline
      loop
    ></video>
  </div>

  <!-- Navigation -->
  <nav class="site-nav">
    <div class="nav-inner liquid-glass">
      <div class="nav-left-group">
        <a href="#" class="nav-logo">
          <!-- Globe (24×24) -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          Cosmic Dentistry
        </a>
        <nav class="nav-links" aria-label="Site navigation">
          <a href="#">Services</a>
          <a href="#">About</a>
          <a href="#">Book</a>
        </nav>
      </div>
      <div class="nav-right">
        <button class="nav-new-patient" type="button">New Patient</button>
        <button class="nav-book-btn liquid-glass" type="button">Book Now</button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <h1>Built for brighter smiles</h1>
    <div class="hero-form-area">
      <form class="email-bar liquid-glass" novalidate>
        <input type="email" placeholder="Enter your email" autocomplete="email" aria-label="Email address">
        <button type="submit" class="submit-btn" aria-label="Subscribe">
          <!-- ArrowRight (20×20, 24×24 viewBox) -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/>
            <path d="M12 5l7 7-7 7"/>
          </svg>
        </button>
      </form>
      <p class="hero-subtitle">Join our list for appointment openings, dental tips, and updates from the Cosmic Dentistry team.</p>
    </div>
    <button class="manifesto-btn liquid-glass" type="button">Read our manifesto</button>
  </main>

  <!-- Social Footer -->
  <footer class="social-footer">
    <button class="icon-btn liquid-glass" type="button" aria-label="Instagram">
      <!-- Instagram (20×20, 24×24 viewBox) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
      </svg>
    </button>
    <button class="icon-btn liquid-glass" type="button" aria-label="Twitter">
      <!-- Twitter / X (20×20, 24×24 viewBox) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 4l16 16"/>
        <path d="M20 4L4 20"/>
      </svg>
    </button>
    <button class="icon-btn liquid-glass" type="button" aria-label="Website">
      <!-- Globe (20×20, 24×24 viewBox) -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
  </footer>

  <script src="/work/azure-cosmetic-dentistry/script.js" defer></script>

</body>
</html>
