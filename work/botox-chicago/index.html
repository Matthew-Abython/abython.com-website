<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botox Chicago</title>
  <meta name="description" content="Natural-looking Botox results, expertly delivered. Chicago's trusted aesthetic injectors.">
  <link rel="stylesheet" href="/work/botox-chicago/styles.css">
</head>
<body>

  <div class="hero-wrapper">

    <!-- ── Background video (self-hosted) ───────────────────── -->
    <video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="/work/botox-chicago/background.mp4" type="video/mp4">
    </video>

    <!-- ── Foreground ───────────────────────────────────────── -->
    <div class="foreground">

      <!-- Nav: two-pill centered layout -->
      <nav class="topnav anim-fade-up anim-d0" role="navigation" aria-label="Main navigation">

        <!-- Left pill: logo circle -->
        <div class="logo-pill" aria-label="Botox Chicago">
          <svg width="18" height="18" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M 128 16 L 240 128 L 128 240 L 16 128 Z" fill="#545454"/>
          </svg>
        </div>

        <!-- Right pill: nav links -->
        <div class="links-pill">
          <a href="#">Treatments</a>
          <a href="#">About</a>
          <a href="#">Results</a>
          <a href="#">Book</a>
        </div>

      </nav>

      <!-- Hero: bottom-left content -->
      <div class="hero-content">
        <div class="hero-inner">

          <a href="#" class="hero-badge anim-fade-up anim-d1">
            Trusted Chicago injectors
            <span class="badge-arrow" aria-hidden="true">→</span>
          </a>

          <h1 class="hero-heading anim-fade-up anim-d2">Natural-looking results, expertly delivered.</h1>

          <p class="hero-subtext anim-fade-up anim-d3">Book your consultation in minutes.</p>

          <a href="#" class="hero-cta anim-fade-up anim-d4" aria-label="Book a free consult">
            Book a free consult
            <span class="cta-arrow" aria-hidden="true">→</span>
          </a>

        </div>
      </div>

    </div>
  </div>

  <script src="/work/botox-chicago/script.js"></script>
</body>
</html>
